[project]
name = "ats-screener"
version = "0.1.0"
description = "Check a resume against a job posting the way an applicant tracking system might."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest"]

[project.scripts]
ats-screener = "ats_screener.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ats_screener"]
